function drawText(str, x, y, col){
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = col;
  let cx = x;
  for(const ch of str){
    const g = F5[ch] || F5[ch.toUpperCase()] || F5[' '];
    for(let r = 0; r < 7; r++) for(let c = 0; c < 5; c++)
      if(g[r][c] === '1') ctx.fillRect(cx + c, y + r, 1, 1);
    cx += 6;
  }
}
function textW(str){ return str.length * 6; }

function drawBackground(){
  for(let y = 0; y < BG_RLE.length; y++){
    let x = 0;
    for(const [ci, len] of BG_RLE[y]){
      ctx.fillStyle = BG_COLORS[ci];
      ctx.fillRect(x, y, len, 1);
      x += len;
    }
  }
}

    let x = 0;
    for(const [ci, len] of POOL_RLE[y]){
      ctx.fillStyle = POOL_COLORS[ci];
      ctx.fillRect(x, 72 + y, len, 1);
      x += len;
    }
  }
  /* 比赛区/ HUD 分隔黑线 */
  ctx.fillStyle = PAL.black; ctx.fillRect(0, DIV_Y, LW, 2);

/* ---------- 输入 (键盘: 方向 + Z/空格=A, X=B; 或内置测试脚本) ---------- */
const Input = { L:0, R:0, U:0, D:0, A:0, B:0, pA:0, pB:0, START:0, pStart:0 };
const KEYMAP = { ArrowLeft:'L', ArrowRight:'R', ArrowUp:'U', ArrowDown:'D', KeyZ:'A', Space:'A', KeyX:'B',
                 Enter:'START', KeyR:'START' };
let scriptMode = null;
addEventListener('keydown', e => {
  const k = KEYMAP[e.code]; if (!k || scriptMode) return;
  if (!Input[k]) { if (k === 'A') Input.pA = 1; if (k === 'B') Input.pB = 1; if (k === 'START') Input.pStart = 1; }
  Input[k] = 1; e.preventDefault();
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code]; if (!k || scriptMode) return;
  Input[k] = 0; e.preventDefault();
});

function applyScript(tick){
  for (const [t, k, v] of DEMO_SCRIPT){
    if (t === tick){
      if (k === 'AIR'){ yy.airFp = v * 256; continue; }    // 测试钩子: 直接设Oxy(整数fp)

      Input[k] = v;

}

  return { O:p.O, W:p.W, S:p.S, s:p.s, d:p.d, C:p.C, c:p.c, H:p.H, h:p.h, T:c.team, L:p.S };
}
function drawPart(map, x, y, colors, flip){
  const w = map[0].length;
  for (let r = 0; r < map.length; r++){
    const row = map[r];
    for (let q = 0; q < w; q++){
      const key = row[q];
      if (key === '.') continue;
      ctx.fillStyle = colors[key];
      ctx.fillRect(x + (flip ? w - 1 - q : q), y + r, 1, 1);
    }
  }
}

/* =====================================================
   B0: 资产层解耦 — SPRITES 数据契约
   -----------------------------------------------------
   玩法代码只认契约, 不认像素是谁画的、来自占位还是正式美术。
   契约定义见《输出/唯一尺寸与画风合同.md》第 4.5 节:
     SPRITES.frames["yy.UW.R.0"] = { w,h,anchorX,anchorY, rows, bbox, hurtbox, hitbox, placeholder }
   - rows      扁平的完整人物字符网格(不再是"24x24头贴上+16x16身体填空")
   - anchorX/Y 世界锚点在帧内的偏移; 状态切换只改绘制原点, 逻辑锚点不动
   - hurtbox/hitbox 是独立数据字段(规格书5.1要求), 当前为 provisional 占位值
   当前 frames 由 bakeFrames() 从阶段2/阶段3 已验收像素合成, 输出与旧渲染逐像素一致。
   正式美术接入方式: bake.py 读概念图流水线的 PNG, 生成同结构的 SPRITES 段替换本段。
   ** 替换时下面的玩法代码零改动。这是美术轨与玩法轨能并行的技术前提。 **
   ===================================================== */
const SPRITES = { meta:{ source:'placeholder-v1', yyHeight:40, ddHeight:47 }, frames:{} };
const frameId = (avatar, action, dir, idx) => avatar + '.' + action + '.' + (dir > 0 ? 'R' : 'L') + '.' + idx;

function composeFrame(lay, bodyMap, headMap, headDy, mir){
  const g = [];
  for (let r = 0; r < lay.h; r++) g.push(new Array(lay.w).fill('.'));
  const blit = (map, x0, y0, flip) => {
    const mh = map.length, mw = map[0].length;
    for (let r = 0; r < mh; r++) for (let q = 0; q < mw; q++){
      const ch = map[r][flip ? mw - 1 - q : q];
      if (ch === '.') continue;
      const x = x0 + q, y = y0 + r;
      if (x >= 0 && x < lay.w && y >= 0 && y < lay.h) g[y][x] = ch;   // 后画的头覆盖身体, 与旧渲染同序
    }
  };
  blit(bodyMap, mir ? lay.w - lay.body[0] - 16 : lay.body[0], lay.body[1], mir);
  blit(headMap, mir ? lay.w - lay.head[0] - 24 : lay.head[0], lay.head[1] + headDy, false);
  return g.map(row => row.join(''));
}
function rowsBBox(rows){
  let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (let r = 0; r < rows.length; r++) for (let q = 0; q < rows[r].length; q++)
    if (rows[r][q] !== '.'){
      if (q < x0) x0 = q; if (q > x1) x1 = q;
      if (r < y0) y0 = r; if (r > y1) y1 = r;
    }
  return x1 < 0 ? null : { x:x0, y:y0, w:x1 - x0 + 1, h:y1 - y0 + 1 };
}

function bakeFrames(){
  const face = (a, d) => AVATAR[a][d];
  const side = (a, d) => HEAD_SIDE[a][d];
  const down = (a, d) => HEAD_DOWN[a][d];
  const brth = i => (a, d) => AVATAR_BREATH[a][d][i];
  /* 已有正式像素的动作(阶段2/3已验收) */
  const REAL = {
    SURF:   [[LAY.SURF, () => BODY.SURF[0], face], [LAY.SURF, () => BODY.SURF[1], face]],
    JUMP:   [[LAY.JUMP[0], () => BODY.JC[0], face], [LAY.JUMP[1], () => BODY.JA[0], side], [LAY.JUMP[2], () => BODY.JF[0], face]],
    DIVE:   [[LAY.DIVE[0], () => BODY.DIVE[0], side], [LAY.DIVE[1], () => BODY.DIVE[1], side], [LAY.DIVE[2], () => BODY.DIVE[2], down]],
    UW:     [[LAY.UW, () => BODY.UW[0], side], [LAY.UW, () => BODY.UW[1], side]],
    UWB:    [[LAY.UW, () => BODY.UWB[0], side], [LAY.UW, () => BODY.UWB[1], side]],
    UWU:    [[LAY.EMERGE, () => BODY.EMERGE[0], face]],
    UWD:    [[LAY.UWV, () => BODY.UWV[0], down]],
    EMERGE: [[LAY.EMERGE, () => BODY.EMERGE[0], face]],
    BREATH: [[LAY.BREATH, () => BODY.SURF[0], face], [LAY.BREATH, () => BODY.BREATH[0], brth(0)],
             [LAY.BREATH, () => BODY.BREATH[1], brth(1)], [LAY.BREATH, () => BODY.BREATH[2], brth(0)]],
  };
  /* 尚无正式美术的动作: 用最接近的既有姿态占位, 全部标 placeholder:true。
     玩法代码现在就能引用它们并写完整状态机, 不必等美术定稿。
     正式帧到位后, 只替换 SPRITES 段, 这张表整张消失。 */
  const PLACE = {
    KICK:             [[LAY.UW, () => BODY.UWB[0], side], [LAY.UW, () => BODY.UWB[1], side]],
    HIT:              [[LAY.UWV, () => BODY.UWV[0], down], [LAY.UW, () => BODY.UW[1], side]],
    DROWN:            [[LAY.UWV, () => BODY.UWV[0], down], [LAY.UW, () => BODY.UW[0], side]],
    LOSE:             [[LAY.SURF, () => BODY.SURF[0], face], [LAY.SURF, () => BODY.SURF[1], face]],
    GRAPPLE:          [[LAY.EMERGE, () => BODY.EMERGE[0], face], [LAY.SURF, () => BODY.SURF[1], face]],
    GRAPPLE_STRUGGLE: [[LAY.SURF, () => BODY.SURF[1], face], [LAY.EMERGE, () => BODY.EMERGE[0], face]],
    GRAPPLE_PUNCH:    [[LAY.EMERGE, () => BODY.EMERGE[0], face], [LAY.BREATH, () => BODY.BREATH[1], face]],
    MOUNT:            [[LAY.SURF, () => BODY.JC[0], face], [LAY.SURF, () => BODY.JF[0], face]],
    MOUNTED:          [[LAY.UWV, () => BODY.UWV[0], down], [LAY.SURF, () => BODY.SURF[0], face]],
    LEGPULL:          [[LAY.UW, () => BODY.UW[0], side], [LAY.UW, () => BODY.UWB[0], side]],
    LEGPULLED:        [[LAY.UW, () => BODY.UW[1], side], [LAY.UWV, () => BODY.UWV[0], down]],
  };
  const build = (table, isPh) => {
    for (const action in table) table[action].forEach((def, idx) => {
      const [lay, bodyOf, headOf] = def;
      for (const avatar of ['yy', 'dd']) for (const dir of [1, -1]){
        const d = dir > 0 ? 'right' : 'left';
        const rows = composeFrame(lay, bodyOf(avatar), headOf(avatar, d), HEAD_DY_FOR(action, idx, avatar), dir < 0);
        const bbox = rowsBBox(rows);
        SPRITES.frames[frameId(avatar, action, dir, idx)] = {
          w: lay.w, h: lay.h, anchorX: lay.anchorX, anchorY: lay.anchorY,
          rows, bbox,
          /* hitbox/hurtbox 由 attachBoxes() 统一注入(在 BAKE 段之后执行,
             占位版与本地美术版都走同一份按动作/相位给值的独立数据)。 */
          hurtbox: [], hitbox: null,
          placeholder: isPh,
        };
      }
    });
  };
  build(REAL, false);
  build(PLACE, true);
}

/* ---------- 判定盒: 独立数据, 不再由像素外接框推导 ----------
   锚点相对坐标 {rx,ry,w,h}, 朝右为基准; 朝左在注入时按帧宽与锚点镜像。
   值按动作给; KICK/GRAPPLE_PUNCH 的 hitbox 按相位(帧idx)给: 起手/收招无判定, 有效相位才有。
   用锚点相对而不是帧内绝对坐标: 换美术(帧宽变化)时盒子跟随锚点语义, 玩法代码零改动。 */
const BOX_TALL = { rx:-10, ry:-38, w:20, h:34 };   // 24x40 直立类(SURF系/EMERGE/BREATH/JUMP首尾帧)
const BOX_SURF = { rx:-10, ry:-38, w:20, h:28 };   // 水面漂浮(身体没入水下部分不计)
const BOX_WIDE = { rx:-18, ry:-22, w:36, h:22 };   // 38x24 横卧类(UW/UWB/KICK/JUMP空中/DIVE横卧)
const BOX_DIVE1 = { rx:-18, ry:-26, w:36, h:24 };  // 38x32 下潜转向帧
const BOX_VERT = { rx:-8,  ry:-38, w:17, h:32 };   // 24x40 垂直类(UWD/DIVE垂直)
const HURTBOX = {
  SURF: BOX_SURF, JUMP: [BOX_TALL, BOX_WIDE, BOX_TALL], BREATH: BOX_TALL,
  DIVE: [BOX_WIDE, BOX_DIVE1, BOX_VERT],
  UW: BOX_WIDE, UWB: BOX_WIDE, UWU: BOX_TALL, UWD: BOX_VERT, EMERGE: BOX_TALL,
  KICK: BOX_WIDE, HIT: [BOX_VERT, BOX_WIDE], DROWN: [BOX_VERT, BOX_WIDE],
  LOSE: BOX_SURF, GRAPPLE: [BOX_TALL, BOX_SURF], GRAPPLE_STRUGGLE: [BOX_SURF, BOX_TALL],
  GRAPPLE_PUNCH: BOX_TALL, MOUNT: BOX_TALL, MOUNTED: [BOX_VERT, BOX_SURF],
  LEGPULL: BOX_WIDE, LEGPULLED: [BOX_WIDE, BOX_VERT],
};
const HITBOX = {
  KICK: [null, { rx:9, ry:-20, w:16, h:16 }],          // idx0起手/收招无判定, idx1有效相位打身前
  GRAPPLE_PUNCH: [null, { rx:2, ry:-32, w:16, h:12 }], // B3 接肩组时按相位复核
};
const boxSpec = (table, action, idx) => {
  const v = table[action];
  return v ? (Array.isArray(v) ? (v[idx] || null) : v) : null;
};
function attachBoxes(){
  for (const id in SPRITES.frames){
    const f = SPRITES.frames[id];
    const p = id.split('.'), dirR = p[2] === 'R', idx = +p[3];
    const toFrame = r => r ? [{ x: dirR ? f.anchorX + r.rx : f.w - f.anchorX - r.rx - r.w,
                                 y: f.anchorY + r.ry, w: r.w, h: r.h }] : null;
    f.hurtbox = toFrame(boxSpec(HURTBOX, p[1], idx)) || [];
    f.hitbox  = toFrame(boxSpec(HITBOX,  p[1], idx));
  }
}
/* 仅正脸头需要 dd 下移2px接下巴; 侧脸/垂直头组合内已对齐 (与旧 headDyFor 等价, 改为按帧静态求值) */
function HEAD_DY_FOR(action, idx, avatar){
  const faceFrame = (action === 'SURF' || action === 'EMERGE' || action === 'UWU' ||
                     action === 'LOSE' || action === 'GRAPPLE' || action === 'GRAPPLE_STRUGGLE' ||
                     action === 'GRAPPLE_PUNCH' || action === 'MOUNT' ||
                     (action === 'MOUNTED' && idx === 1) ||
                     (action === 'BREATH') ||
                     (action === 'JUMP' && idx !== 1));
  return faceFrame ? HEAD_DY[avatar] : 0;
}
/* BAKE:SPRITES:BEGIN —— 本段由 bake.py 整段替换, 手工编辑会在下次 bake 时丢失 */
bakeFrames();                       // 占位资产: 由阶段2/3已验收像素合成, 全部 placeholder:true
/* BAKE:SPRITES:END */
attachBoxes();                      // 判定盒注入: 对占位帧与 bake.py 正式帧同样生效

/* 两种像素来源:
   - 占位帧: 字符=语义调色键(O/S/W/...), 颜色由 colorsFor() 按角色/水下给出
   - 正式帧: 字符=调色板索引, 颜色由 f.pal 直接给出(概念图流水线的24色共享调色板)
   玩法代码对二者无感。 */
/* 正式帧的水下配色: 规格书4.1要求"水下角色直接切换为青/蓝水下专用精灵配色",
   且不得用 globalAlpha 或棋盘格覆盖。占位帧走 UW_MAP 语义映射, 正式帧按调色板整体偏移,
   结果同样是硬切色。每张调色板只算一次并缓存(不可枚举, 不污染契约自检)。 */
function uwPalette(pal){
  if (pal.__uw) return pal.__uw;
  const out = {};
  for (const k in pal){
    const h = pal[k];
    const r = parseInt(h.slice(1, 3), 16), g = parseInt(h.slice(3, 5), 16), b = parseInt(h.slice(5, 7), 16);
    const c = [(r * 0.34) | 0, (g * 0.62 + 38) | 0, Math.min(255, (b * 0.55 + 96) | 0)];
    out[k] = '#' + c.map(v => Math.min(255, v).toString(16).padStart(2, '0')).join('').toUpperCase();
  }
  Object.defineProperty(pal, '__uw', { value: out });
  return out;
}
function drawFrame(f, x, y, colors, uw){
  const pal = f.pal ? (uw ? uwPalette(f.pal) : f.pal) : colors;
  for (let r = 0; r < f.rows.length; r++){
    const row = f.rows[r];
    for (let q = 0; q < row.length; q++){
      const k = row[q];
      if (k === '.') continue;
      ctx.fillStyle = pal[k];
      ctx.fillRect(x + q, y + r, 1, 1);
    }
  }
}

/* ---------- 角色状态机 (锚点=脚底中心, 全整数定点: 坐标/速度/斜向系数均为fp整数, 1px=256fp) ---------- */
const ST = { SURF:'SURF', JUMP:'JUMP', DIVE:'DIVE', UW:'UW', EMERGE:'EMERGE', BREATH:'BREATH',
             DROWN:'DROWN', LOSE:'LOSE', KICK:'KICK', HIT:'HIT',
             GRAPPLE:'GRAPPLE', GRAPPLE_STRUGGLE:'GRAPPLE_STRUGGLE', GRAPPLE_PUNCH:'GRAPPLE_PUNCH' };
const FOOT_SURF_Fp = FP(ORIGINAL_TUNING.surfFootY);            // 水面脚底锚点 y=108
/* 统一横向钳制带(与状态无关→切换不瞬移)。
   ** 必须由当前 SPRITES 资产推导, 不能写死 **: 占位帧宽38px、概念图正式帧宽61px,
   写死的 [20,236] 会让正式帧左右出画。资产层解耦要求钳制带随资产走。 */
function spriteExtents(){
  let left = 0, right = 0;
  for (const id in SPRITES.frames){
    const f = SPRITES.frames[id], b = f.bbox;
    if (!b) continue;
    left  = Math.max(left,  f.anchorX - b.x);                  // 锚点左侧最大伸出
    right = Math.max(right, (b.x + b.w - 1) - f.anchorX);      // 锚点右侧最大伸出
  }
  return { left, right };
}
const EXT = spriteExtents();
const ANCHOR_X_MIN_Fp = FP(EXT.left), ANCHOR_X_MAX_Fp = FP(LW - 1 - EXT.right);
function mkChar(xFp, dir, avatar, team){
  return { axFp: xFp, ayFp: FOOT_SURF_Fp, dir, prefDir: 0, avatar, team,   // R3: 预选方向初始0(无证据默认朝向水平跳)
           state: ST.SURF, t: 0, boostFp: 0, airFp: ORIGINAL_TUNING.airMaxFp,
           hpFp: ORIGINAL_TUNING.hpMaxFp,
           swimT: 0, jumpDir: 0, jumpX0Fp: xFp, emergeFromFp: 0, uwPose: 'H',   // R6: UW方向三态 H横卧/U头朝上/D头朝下
           id: avatar, input: 'IDLE', hitDir: 0, iid: null, punchSeq: 0 };   // id=interaction里的角色标识; input=inputSource键; iid=持有的交互id; punchSeq=出拳序号(命中事件去重键的一部分)
}
const yy  = mkChar(FP(94), 1, 'yy', '#3C9CF0');    // 阳阳(玩家)
const dad = mkChar(FP(180), -1, 'dd', '#F83800');  // 爸爸(B5前为空输入)
yy.input = '1P';
const parts = [];                                  // 粒子 {type, xFp, yFp, t, inAir} 全整数

function spawnSplash(xFp, yFp){ parts.push({ type:'splash', xFp: xFp - FP(4), yFp: yFp - FP(2), t: 0, inAir: false }); }
function spawnBubble(xFp, yFp, inAir){ parts.push({ type:'bubble', xFp, yFp, t: 0, inAir }); }

function diveIdx(t){                               // DIVE三过程帧: t≤2横卧准备 / t≤4转向 / 其余垂直下沉 (实测f15615..f15620)
  const T = ORIGINAL_TUNING;
  return t <= T.diveFlatTicks ? 0 : t <= T.diveFlatTicks + T.diveTurnTicks ? 1 : 2;
}
function breathBodyIdx(t){                         // BREATH四段身体: 准备−1(水面帧)/上升0挺起/顶峰1展臂/回落2
  const T = ORIGINAL_TUNING;
  return t <= T.breathPrepTicks ? -1
       : t <= T.breathPrepTicks + T.breathRiseTicks ? 0
       : t <= T.breathPrepTicks + T.breathRiseTicks + T.breathHoldTicks ? 1 : 2;
}
function breathHeadIdx(t){                         // 头像: 准备−1(normal)/上升0/顶峰1张嘴/回落0, 与身体同步
  const T = ORIGINAL_TUNING;
  return t <= T.breathPrepTicks ? -1
       : t <= T.breathPrepTicks + T.breathRiseTicks ? 0
       : t <= T.breathPrepTicks + T.breathRiseTicks + T.breathHoldTicks ? 1 : 0;
}
function jumpIdx(t){                               // JUMP三帧: 起跳蹲JC / 滞空横向飞扑JA / 下落JF
  const T = ORIGINAL_TUNING;
  return t < T.jumpFrame1Tick ? 0 : t < T.jumpFrame2Tick ? 1 : 2;
}
/* 角色状态 → SPRITES 契约里的帧 id。这是玩法层与美术层唯一的接触面:
   换美术只换 SPRITES.frames 的内容, 本函数与其余玩法代码都不动。 */
function frameIdFor(c){
  const T = ORIGINAL_TUNING;
  let action = 'SURF', idx = 0;
  switch (c.state){
    case ST.JUMP:   action = 'JUMP';   idx = jumpIdx(c.t); break;
    case ST.DIVE:   action = 'DIVE';   idx = diveIdx(c.t); break;
    case ST.UW:                                      // R6三态: H横卧(加速用UWB流线帧) / U头朝上 / D头朝下蜷身
      if (c.uwPose === 'U') action = 'UWU';
      else if (c.uwPose === 'D') action = 'UWD';
      else {
        action = c.boostFp > 0 ? 'UWB' : 'UW';
        idx = Math.floor(c.swimT / (c.boostFp > 0 ? T.boostCycleTicks : T.swimCycleTicks)) % 2;
      }
      break;
    case ST.EMERGE: action = 'EMERGE'; break;
    case ST.KICK:   action = 'KICK';   idx = kickPhaseOf(c.t) === 'ACTIVE' ? 1 : 0; break; // 起手/收招用idx0(无hitbox), 有效相位idx1
    case ST.HIT:    action = 'HIT';    idx = Math.floor(c.t / 8) % 2; break;
    case ST.GRAPPLE:          action = 'GRAPPLE';          idx = Math.floor(c.t / 16) % 2; break;
    case ST.GRAPPLE_STRUGGLE: action = 'GRAPPLE_STRUGGLE'; idx = Math.floor(c.t / 8) % 2; break;
    case ST.GRAPPLE_PUNCH:    action = 'GRAPPLE_PUNCH';    idx = punchPhaseOf(c.t) === 'ACTIVE' ? 1 : 0; break;
    case ST.BREATH: action = 'BREATH'; idx = breathBodyIdx(c.t) + 1; break;   // −1..2 → 0..3
    case ST.DROWN:  action = 'DROWN';  idx = Math.floor(c.t / 16) % 2; break; // 占位帧
    case ST.LOSE:   action = 'LOSE';   idx = Math.floor(c.t / 24) % 2; break; // 占位帧
    default:        action = 'SURF';   idx = Math.floor(c.t / T.floatBobTicks) % 2;
  }
  return frameId(c.avatar, action, c.dir, idx);
}

function tickChar(c, inp, intent){
  const T = ORIGINAL_TUNING;
  c.t++;
  switch (c.state){
    case ST.SURF: {
      c.ayFp = FOOT_SURF_Fp;
      if (inp.L){ c.dir = -1; c.prefDir = -1; c.axFp -= T.surfDriftFp; }  // 保存最后方向(跳跃预选)
      if (inp.R){ c.dir = 1;  c.prefDir = 1;  c.axFp += T.surfDriftFp; }
      if (inp.pA){                                             // 跳跃: 方向键>预选方向; 都无→0垂直跳
        c.state = ST.JUMP; c.t = 0;
        c.jumpDir = inp.L ? -1 : inp.R ? 1 : c.prefDir;
        c.jumpX0Fp = c.axFp;
        spawnSplash(c.axFp, T.splashYFp);
        break;
      }
      if (inp.pB){ c.state = ST.BREATH; c.t = 0; break; }      // B超级换气
      if (inp.D){ c.state = ST.DIVE; c.t = 0; spawnSplash(c.axFp, T.splashYFp); break; }
      c.airFp = Math.min(T.airMaxFp, c.airFp + T.airRecoverFp); // 水面自然恢复Oxy
      break;
    }
    case ST.BREATH: {                                // 待标定占位44tick四段(f16044..f16066不完整, 无第二样本): 准备4/上升12/顶峰18/回落10
      const t = c.t, p = T.breathPrepTicks, r = T.breathRiseTicks, h = T.breathHoldTicks;
      if (inp.L){ c.dir = -1; c.axFp -= T.breathDriftFp; }   // 换气中方向输入(速度待标定占位=0, 参数已接入消费)
      if (inp.R){ c.dir = 1;  c.axFp += T.breathDriftFp; }
      if (t <= p)                                    // 低姿准备 t1..4: 脚底108
        c.ayFp = FOOT_SURF_Fp;
      else if (t <= p + r)                           // 上升 t5..16: 108→96 (每tick约−1px, 严格单调)
        c.ayFp = FOOT_SURF_Fp - ((T.breathRiseFp * (t - p) / r) | 0);
      else if (t <= p + r + h)                       // 顶峰保持 t17..34: 96 (双臂展开+张嘴)
        c.ayFp = FOOT_SURF_Fp - T.breathRiseFp;
      else                                           // 回落 t35..44: 96→108 (非降)
        c.ayFp = FOOT_SURF_Fp - T.breathRiseFp +
                 ((T.breathRiseFp * (t - p - r - h) / T.breathFallTicks) | 0);
      if (c.t % T.breathBubbleEvery === 0)
        spawnBubble(c.axFp + c.dir * T.breathBubbleFwdFp, T.breathBubbleYFp, true);
      /* 换气过程不回氧; 完成事件一次设满(复审指令硬性规格); 水平=方向键×breathDriftFp(待标定占位0) */
      if (c.t >= T.breathLockTicks){
        c.state = ST.SURF; c.t = 0; c.ayFp = FOOT_SURF_Fp; c.airFp = T.airMaxFp;
      }
      break;
    }
    case ST.JUMP: {                                    // 整数抛物线, 方向预选, 明确±位移(垂直跳dir=0)
      const n = c.t, N = T.jumpTicks;
      c.ayFp = FOOT_SURF_Fp - ((T.jumpRiseFp * 4 * n * (N - n) / (N * N)) | 0);
      c.axFp += c.jumpDir * T.jumpMoveXFp;
      if (c.t >= N){
        c.state = ST.SURF; c.t = 0; c.ayFp = FOOT_SURF_Fp;
        spawnSplash(c.axFp, T.splashYFp);
      }
      break;
    }
    case ST.DIVE: {                                    // 必须按住↓推进; 松开按diveBackSpeed弹回
      if (!inp.D){
        c.t -= T.diveBackSpeed;
        if (c.t <= 0){ c.state = ST.SURF; c.t = 0; c.ayFp = FOOT_SURF_Fp;
          spawnSplash(c.axFp, T.splashYFp); break; }
      }
      c.ayFp = FOOT_SURF_Fp + ((T.diveSinkFp * c.t / T.diveTicks) | 0);   // 108→120, 与UW入点连续
      if (c.t >= T.diveTicks){ c.state = ST.UW; c.t = 0; c.ayFp = T.uwTopFp; c.boostFp = 0; c.uwPose = 'D'; }  // 垂直下潜→头朝下蜷身(布局同族, 逐帧连续)
      break;
    }
    case ST.UW: {
      const it = intent || decide(c, snapChar(c), null, inp);   // 无对手的单角色自检路径也能进KICK
      if (it.startKick){ c.state = ST.KICK; c.t = 0; c.boostFp = 0; break; }   // 水下踢击起手
      const dx = (inp.R ? 1 : 0) - (inp.L ? 1 : 0);
      const dy = (inp.D ? 1 : 0) - (inp.U ? 1 : 0);
      if (dx) c.dir = dx;
      c.uwPose = dx !== 0 ? 'H' : dy < 0 ? 'U' : 'D';   // R6三态: 有横向→横卧; 纯↑→头朝上; 纯↓/无输入→头朝下蜷身(斜向缺原版证据, 归横卧)
      const moving = (dx !== 0 || dy !== 0);
      if (moving && inp.pA)                                // 仅"移动中+A新边沿"才累积, 静止不储能
        c.boostFp = Math.min(T.boostMaxFp, c.boostFp + T.boostPerPressFp);
      c.boostFp = Math.max(0, c.boostFp - T.boostDecayFp);
      let sp = T.swimSpeedFp + c.boostFp;
      if (dx && dy) sp = (sp * T.diagFp) >> 8;                 // 整数斜向系数 181/256≈0.707
      c.axFp += dx * sp; c.ayFp += dy * sp;
      if (moving){
        c.swimT++;
        const every = c.boostFp > 0 ? T.boostBubbleEvery : T.uwBubbleEvery;
        if (c.swimT % every === 0)
          spawnBubble(c.axFp + c.dir * T.uwBubbleFwdFp, c.ayFp - T.uwBubbleUpFp, false);
      }
      if (inp.U && c.ayFp <= T.uwTopFp){                 // 到顶上浮; 离开UW立即清零boost
        c.state = ST.EMERGE; c.t = 0; c.emergeFromFp = c.ayFp; c.boostFp = 0; break;
      }
      c.airFp = Math.max(0, c.airFp - T.airDrainFp);           // 水下耗氧
      if (c.airFp <= 0){                                       // 氧气归零→气绝(硬标准: 规则性事实)
        c.state = ST.DROWN; c.t = 0; c.boostFp = 0; c.uwPose = 'D';
        spawnBubble(c.axFp, c.ayFp - T.uwBubbleUpFp, false);
      }
      break;
    }
    case ST.DROWN: {                                   // 气绝: 失去操控, 缓慢上浮, 持续掉血(硬标准); 速率为估值
      c.hpFp = Math.max(0, c.hpFp - T.drownDrainFp);
      c.ayFp -= T.drownRiseFp;
      if (c.t % T.uwBubbleEvery === 0) spawnBubble(c.axFp, c.ayFp - T.uwBubbleUpFp, false);
      if (c.ayFp <= FOOT_SURF_Fp){                     // 呛回水面: 只恢复一部分氧, 不是满槽
        c.ayFp = FOOT_SURF_Fp; c.state = ST.SURF; c.t = 0;
        c.airFp = T.drownRecoverFp;
        spawnSplash(c.axFp, T.splashYFp);
      }
      break;
    }
    case ST.LOSE: { c.ayFp = FOOT_SURF_Fp; break; }    // 败北: 停在水面(演出属 B4)
    case ST.KICK: {                                    // 水下踢击: 起手/有效/收招三相位, 期间不能移动
      c.airFp = Math.max(0, c.airFp - T.airDrainFp);
      if (c.airFp <= 0){                                        // 水下耗氧归零→气绝(与UW一致)
        c.state = ST.DROWN; c.t = 0; c.boostFp = 0; c.uwPose = 'D';
        spawnBubble(c.axFp, c.ayFp - T.uwBubbleUpFp, false); break;
      }
      if (c.t >= T.kickTotalTicks){ c.state = ST.UW; c.t = 0; c.uwPose = 'H'; }
      break;
    }
    case ST.HIT: {                                     // 受击: 击退+硬直, 结束回水下
      c.axFp += c.hitDir * T.hitKnockFp;
      c.airFp = Math.max(0, c.airFp - T.airDrainFp);
      if (c.airFp <= 0){
        c.state = ST.DROWN; c.t = 0; c.boostFp = 0; c.uwPose = 'D';
        spawnBubble(c.axFp, c.ayFp - T.uwBubbleUpFp, false); break;
      }
      if (c.t >= T.hitStunTicks){ c.state = ST.UW; c.t = 0; c.uwPose = 'D'; }
      break;
    }
    /* 肩组三态: 位置由 resolvePair/pinGrapple 钉在共用接触锚点上, 这里只推进计时与出拳 */
    case ST.GRAPPLE: {
      const it = intent || decide(c, snapChar(c), null, inp);
      if (it.startPunch){ c.state = ST.GRAPPLE_PUNCH; c.t = 0; c.punchSeq++; }
      break;
    }
    case ST.GRAPPLE_PUNCH: {                           // 出拳: 起手/有效/收招, 命中判定在 resolvePair
      if (c.t >= T.punchTotalTicks){ c.state = ST.GRAPPLE; c.t = 0; }
      break;
    }
    case ST.GRAPPLE_STRUGGLE: {                        // 被揍/挣扎: 对方收招后由 GRAPPLE_SETTLE 带回对峙
      break;
    }
    case ST.EMERGE: {
      const from = c.emergeFromFp, to = FOOT_SURF_Fp;
      c.ayFp = from - (((from - to) * c.t / T.emergeTicks) | 0);
      if (c.t >= T.emergeTicks || c.ayFp <= to){
        c.state = ST.SURF; c.t = 0; c.ayFp = to;
        spawnSplash(c.axFp, T.splashYFp);
      }
      break;
    }
  }
  clampChar(c);
}

/* 锚点钳制: 横向统一[20,236]与状态无关; UW纵向全姿态统一[120,166](R6删UWV例外域, 姿态切换坐标不变) */
function clampChar(c){
  c.axFp = Math.max(ANCHOR_X_MIN_Fp, Math.min(ANCHOR_X_MAX_Fp, c.axFp));
  if (c.state === ST.UW || c.state === ST.KICK || c.state === ST.HIT ||
      c.state === ST.GRAPPLE || c.state === ST.GRAPPLE_PUNCH || c.state === ST.GRAPPLE_STRUGGLE){
    const T = ORIGINAL_TUNING;
    c.ayFp = Math.max(T.uwTopFp, Math.min(T.uwBotFp, c.ayFp));
  }
}

function tickParts(){
  const T = ORIGINAL_TUNING;
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.t++;
    if (p.type === 'bubble'){
      if (p.inAir){                                            // 换气气泡: 纯寿命, 空气中缓升
        p.yFp -= T.bubbleRiseAirFp;
        if (p.t > T.bubbleLifeAir) parts.splice(i, 1);
      } else {                                                 // 水下气泡: 破灭线 + 寿命
        p.yFp -= T.bubbleRiseUwFp;
        if ((p.yFp >> 8) < T.bubblePopY || p.t > T.bubbleLifeUw) parts.splice(i, 1);
      }
    } else if (p.t > T.splashTicks) parts.splice(i, 1);
  }
}

const IDLE_INPUT = { L:0,R:0,U:0,D:0,A:0,B:0,pA:0,pB:0 };

/* =====================================================
   B2: 同步战斗内核 — 快照式结算 + inputSource 抽象 + 唯一 interaction 骨架 + 水下踢击
   tick() 的 FIGHT 分支按四段组织(规格书3.1), 消除"先tick者占便宜"的先手偏差:
     ① 冻结双方旧状态快照 + 同时读取双方输入
     ② 各自 decide() 生成意图, 只读快照, 不读对方的新状态
     ③ resolvePair() 统一解析命中/优先级, 驱动唯一一个 interaction 对象
     ④ commit: tickChar×2 + applyFx, 双方效果同一tick内一起落地
   ===================================================== */
/* 输入源抽象: 1P键盘 / IDLE空输入; 2P / CPU / REPLAY 在 B5 接入本表, tick() 不变 */
const InputSources = {
  '1P':   () => Input,
  'IDLE': () => IDLE_INPUT,
};
function readInput(c){ return InputSources[c.input](); }

function snapChar(c){                                  // ① 快照: 结算期间对方只能读到这份冻结值
  return { id: c.avatar, avatar: c.avatar, axFp: c.axFp, ayFp: c.ayFp, dir: c.dir,
           state: c.state, t: c.t, uwPose: c.uwPose, swimT: c.swimT, boostFp: c.boostFp,
           hpFp: c.hpFp, airFp: c.airFp, punchSeq: c.punchSeq };
}
/* ② 意图: 只读快照与输入。本轮有踢击/出拳两种; 骑头/拉脚的意图在 B3b 挂进同一结构 */
function decide(c, self, foe, inp){
  return {
    startKick:  !!(inp.pB && self.state === ST.UW),
    startPunch: !!(inp.pB && self.state === ST.GRAPPLE),
    moveX: (inp.R ? 1 : 0) - (inp.L ? 1 : 0),
    moveY: (inp.D ? 1 : 0) - (inp.U ? 1 : 0),
    active: !!(inp.L || inp.R || inp.U || inp.D || inp.A || inp.B || inp.pA || inp.pB),
  };
}

/* 唯一成对交互对象。建立/中断/结束都发生在 resolvePair/commit 的同一tick内(原子);
   两个角色只持有它的 id(c.iid)。kind 现有 'KICK' 与 'GRAPPLE', 结构按四种交互设计。
   字段语义(B3a 复核, 台账S-05):
     pairAnchor  KICK=双方锚点中点(仅信息); GRAPPLE=共用接触锚点, 建立时定格, 双方每tick钉在它上面
     facing      KICK=攻击方朝向; GRAPPLE=从 aId 指向 bId 的纠缠朝向(决定钉位左右)
     drawOrder   防守方/被揍方先画, 攻击方/出拳方叠上层; 肩组对峙时发起方(aId)在上 */
let interaction = null;
let nextIid = 1;

function kickPhaseOf(t){
  const T = ORIGINAL_TUNING;
  return t < T.kickStartupTicks ? 'STARTUP'
       : t < T.kickStartupTicks + T.kickActiveTicks ? 'ACTIVE' : 'RECOVER';
}
function punchPhaseOf(t){
  const T = ORIGINAL_TUNING;
  return t < T.punchStartupTicks ? 'STARTUP'
       : t < T.punchStartupTicks + T.punchActiveTicks ? 'ACTIVE' : 'RECOVER';
}
function isGrappleState(st){
  return st === ST.GRAPPLE || st === ST.GRAPPLE_PUNCH || st === ST.GRAPPLE_STRUGGLE;
}
function movingToward(self, foe, d){                    // 输入方向与敌我相对位置同号 = 朝对手移动
  return !!((d.moveX && (foe.axFp - self.axFp) * d.moveX > 0) ||
            (d.moveY && (foe.ayFp - self.ayFp) * d.moveY > 0));
}
/* 快照角色当前帧的判定盒 → 世界坐标 [x, y, w, h] (与 drawSwimmers 同一定位) */
function frameBox(snap, kind){
  const f = SPRITES.frames[frameIdFor(snap)];
  const bs = f[kind];
  if (!bs || !bs.length) return null;
  const b = bs[0];
  return [ (snap.axFp >> 8) - f.anchorX + b.x, (snap.ayFp >> 8) - f.anchorY + b.y, b.w, b.h ];
}
function boxOverlap(a, b){
  return a[0] < b[0] + b[2] && b[0] < a[0] + a[2] && a[1] < b[1] + b[3] && b[1] < a[1] + a[3];
}
/* ③ 统一解析: 读快照, 返回本tick要落地的效果列表; 事件用 (interaction.id, eventId) 去重 */
function resolvePair(sA, sB, dA, dB){
  const fx = [];
  const T = ORIGINAL_TUNING;
  const kickA = sA.state === ST.KICK || dA.startKick;
  const kickB = sB.state === ST.KICK || dB.startKick;
  const grapA = isGrappleState(sA.state), grapB = isGrappleState(sB.state);
  if (interaction && interaction.kind === 'GRAPPLE' && (grapA || grapB)){
    /* ---- 肩组中 ---- */
    interaction.pairTick++;
    const puncher = sA.state === ST.GRAPPLE_PUNCH ? sA : sB.state === ST.GRAPPLE_PUNCH ? sB : null;
    interaction.phase = puncher ? punchPhaseOf(puncher.t) : 'HOLD';
    interaction.drawOrder = puncher ? [ (puncher === sA ? sB : sA).id, puncher.id ]
                                    : [interaction.bId, interaction.aId];
    /* 出拳命中: 有效相位 + GRAPPLE_PUNCH判定盒; 按 (interaction.id, 'punch:谁:第几拳') 去重 */
    for (const [att, def] of [[sA, sB], [sB, sA]]){
      if (att.state !== ST.GRAPPLE_PUNCH || punchPhaseOf(att.t) !== 'ACTIVE') continue;
      const evId = 'punch:' + att.id + ':' + att.punchSeq;
      if (interaction.appliedEvents[evId]) continue;
      const hb = frameBox(att, 'hitbox'), db = frameBox(def, 'hurtbox');
      if (hb && db && boxOverlap(hb, db)){
        interaction.appliedEvents[evId] = true;
        fx.push({ type: 'PUNCH_HIT', targetId: def.id });
      }
    }
    /* 被揍方在对方收招后回到对峙 */
    if (sA.state === ST.GRAPPLE_STRUGGLE && sB.state !== ST.GRAPPLE_PUNCH)
      fx.push({ type: 'GRAPPLE_SETTLE', targetId: sA.id });
    if (sB.state === ST.GRAPPLE_STRUGGLE && sA.state !== ST.GRAPPLE_PUNCH)
      fx.push({ type: 'GRAPPLE_SETTLE', targetId: sB.id });
    /* 解开: 双方全无输入持续 grappleIdleTicks, 或纠缠达 grappleMaxTicks 上限 —— 两条确定路径 */
    if (dA.active || dB.active) interaction.idleN = 0; else interaction.idleN++;
    if (interaction.idleN >= T.grappleIdleTicks || interaction.pairTick >= T.grappleMaxTicks)
      fx.push({ type: 'GRAPPLE_OFF' });
  } else if (kickA || kickB){
    if (!interaction){
      interaction = { id: nextIid++, kind: 'KICK', phase: 'STARTUP', pairTick: 0,
                      aId: sA.id, bId: sB.id, aRole: 'attacker', bRole: 'defender',
                      pairAnchor: [0, 0], facing: 1, drawOrder: [sA.id, sB.id],
                      appliedEvents: {}, idleN: 0 };
    } else interaction.pairTick++;
    interaction.aRole = kickA ? 'attacker' : 'defender';
    interaction.bRole = kickB ? 'attacker' : 'defender';
    interaction.pairAnchor = [ (sA.axFp + sB.axFp) >> 1, (sA.ayFp + sB.ayFp) >> 1 ];
    interaction.facing = kickA ? sA.dir : sB.dir;
    interaction.drawOrder = kickA ? [sB.id, sA.id] : [sA.id, sB.id];   // 防守方先画, 攻击方叠在上层
    const phA = sA.state === ST.KICK ? kickPhaseOf(sA.t) : null;
    const phB = sB.state === ST.KICK ? kickPhaseOf(sB.t) : null;
    interaction.phase = (phA === 'ACTIVE' || phB === 'ACTIVE') ? 'ACTIVE'
                      : (phA === 'RECOVER' || phB === 'RECOVER') ? 'RECOVER' : 'STARTUP';
    for (const [att, def] of [[sA, sB], [sB, sA]]){
      if (att.state !== ST.KICK || kickPhaseOf(att.t) !== 'ACTIVE') continue;
      const evId = 'hit:' + att.id;
      if (interaction.appliedEvents[evId]) continue;
      const hb = frameBox(att, 'hitbox'), db = frameBox(def, 'hurtbox');
      if (hb && db && boxOverlap(hb, db)){
        interaction.appliedEvents[evId] = true;
        fx.push({ type: 'HIT', targetId: def.id, knockDir: def.axFp >= att.axFp ? 1 : -1 });
      }
    }
  } else if (!interaction && sA.state === ST.UW && sB.state === ST.UW){
    /* 肩组进入(规格书3.3): 水下、未肩组、朝对手方向移动并接触 → 本tick双方一起进(commit落地) */
    const towA = movingToward(sA, sB, dA), towB = movingToward(sB, sA, dB);
    const ha = frameBox(sA, 'hurtbox'), hb = frameBox(sB, 'hurtbox');
    if ((towA || towB) && ha && hb && boxOverlap(ha, hb)){
      interaction = { id: nextIid++, kind: 'GRAPPLE', phase: 'HOLD', pairTick: 0,
                      aId: sA.id, bId: sB.id,
                      aRole: towA ? 'attacker' : 'defender', bRole: towB ? 'attacker' : 'defender',
                      pairAnchor: [ (sA.axFp + sB.axFp) >> 1, (sA.ayFp + sB.ayFp) >> 1 ],
                      facing: sB.axFp >= sA.axFp ? 1 : -1,
                      drawOrder: [sB.id, sA.id], appliedEvents: {}, idleN: 0 };
      fx.push({ type: 'GRAPPLE_ON' });
    }
  } else if (interaction){
    interaction = null;
  }
  return fx;
}
function applyFx(fx){
  const T = ORIGINAL_TUNING;
  for (const e of fx){
    if (e.type === 'HIT'){
      const c = e.targetId === 'yy' ? yy : dad;
      c.hpFp = Math.max(0, c.hpFp - T.kickDamageFp);
      c.state = ST.HIT; c.t = 0; c.hitDir = e.knockDir; c.boostFp = 0;
      spawnBubble(c.axFp, c.ayFp - T.uwBubbleUpFp, false);
      continue;
    }
    if (e.type === 'PUNCH_HIT'){                          // 肩组出拳命中: 扣血+进挣扎, 不解开不击退
      const c = e.targetId === 'yy' ? yy : dad;
      c.hpFp = Math.max(0, c.hpFp - T.punchDamageFp);
      c.state = ST.GRAPPLE_STRUGGLE; c.t = 0;
      spawnBubble(c.axFp, c.ayFp - T.uwBubbleUpFp, false);
      continue;
    }
    if (e.type === 'GRAPPLE_ON'){                         // 双方同时进入肩组(同一commit落地)
      for (const c of [yy, dad]){ c.state = ST.GRAPPLE; c.t = 0; c.boostFp = 0; }
      continue;
    }
    if (e.type === 'GRAPPLE_SETTLE'){                     // 被揍方回对峙
      const c = e.targetId === 'yy' ? yy : dad;
      if (c.state === ST.GRAPPLE_STRUGGLE){ c.state = ST.GRAPPLE; c.t = 0; }
      continue;
    }
    if (e.type === 'GRAPPLE_OFF'){                        // 解开: 双方各退半步回水下
      const f = interaction ? interaction.facing : 1;
      const a = interaction && interaction.aId === 'dd' ? dad : yy;
      const b = a === yy ? dad : yy;
      a.state = ST.UW; a.t = 0; a.uwPose = 'H'; a.axFp -= f * T.grappleBreakFp;
      b.state = ST.UW; b.t = 0; b.uwPose = 'H'; b.axFp += f * T.grappleBreakFp;
      clampChar(a); clampChar(b);
    }
  }
}
/* 肩组钉位: 双方共用 pairAnchor, 间距/朝向固定, 每tick commit 后执行 —— 绘制不得各自漂移 */
function pinGrapple(){
  const T = ORIGINAL_TUNING, f = interaction.facing;
  const a = interaction.aId === 'yy' ? yy : dad;
  const b = a === yy ? dad : yy;
  a.axFp = interaction.pairAnchor[0] - f * (T.grappleGapFp >> 1);
  b.axFp = interaction.pairAnchor[0] + f * (T.grappleGapFp - (T.grappleGapFp >> 1));
  a.ayFp = b.ayFp = interaction.pairAnchor[1];
  a.dir = f; b.dir = -f;
}
/* 逐tick状态hash(FNV-1a): 覆盖比赛/双方角色/粒子/交互, 供确定性双跑自检 */
function hashState(){
  let h = 0x811c9dc5;
  const mix = v => {
    const s = String(v);
    for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
    h ^= 124; h = Math.imul(h, 0x01000193);
  };
  mix(tickCount); mix(MATCH.ticksLeft); mix(MATCH.phase);
  for (const c of [yy, dad]){
    mix(c.axFp); mix(c.ayFp); mix(c.state); mix(c.t); mix(c.dir); mix(c.hpFp);
    mix(c.airFp); mix(c.boostFp); mix(c.uwPose); mix(c.hitDir); mix(c.iid); mix(c.punchSeq);
  }
  for (const p of parts){ mix(p.type); mix(p.xFp); mix(p.yFp); mix(p.t); }
  if (interaction){
    mix(interaction.id); mix(interaction.kind); mix(interaction.phase); mix(interaction.pairTick);
    mix(interaction.pairAnchor[0]); mix(interaction.pairAnchor[1]);
    mix(interaction.facing); mix(interaction.idleN);
    for (const k in interaction.appliedEvents) mix(k);
  }
  return h >>> 0;
}

/* =====================================================
   B1: 比赛流程 — 倒计时 / HP / 胜负判定
   硬标准(规则性事实): 3:00 倒计时; 氧气归零进气绝并持续掉血;
                      HP归零判负; 时间到按HP高者胜, 同分平局。
   ===================================================== */
const MATCH = { ticksLeft: ORIGINAL_TUNING.matchTicks, phase:'FIGHT', winner:null, overT:0 };
function resetMatch(){
  const T = ORIGINAL_TUNING;
  MATCH.ticksLeft = T.matchTicks; MATCH.phase = 'FIGHT'; MATCH.winner = null; MATCH.overT = 0;
  const spawn = [[yy, FP(94), 1], [dad, FP(180), -1]];
  for (const [c, x, d] of spawn){
    c.axFp = x; c.ayFp = FOOT_SURF_Fp; c.dir = d; c.prefDir = 0;
    c.state = ST.SURF; c.t = 0; c.boostFp = 0; c.swimT = 0; c.uwPose = 'H';
    c.jumpDir = 0; c.jumpX0Fp = x; c.emergeFromFp = 0;
    c.airFp = T.airMaxFp; c.hpFp = T.hpMaxFp;
    c.hitDir = 0; c.iid = null; c.punchSeq = 0;
  }
  parts.length = 0;
  interaction = null; nextIid = 1;                   // 交互状态随比赛一起重置(确定性双跑的前提)
}
function endMatch(w){
  MATCH.phase = 'OVER'; MATCH.winner = w; MATCH.overT = 0;
  interaction = null; yy.iid = dad.iid = null;       // 比赛结束时交互一并摘掉
  for (const c of [yy, dad])
    if (c.hpFp <= 0){ c.state = ST.LOSE; c.t = 0; c.ayFp = FOOT_SURF_Fp; }
}
function resolveMatch(){
  if (MATCH.phase !== 'FIGHT') return;
  const a = yy.hpFp <= 0, b = dad.hpFp <= 0;
  if (a && b) return endMatch('draw');
  if (a) return endMatch('dad');
  if (b) return endMatch('yy');
  if (MATCH.ticksLeft <= 0)
    return endMatch(yy.hpFp === dad.hpFp ? 'draw' : yy.hpFp > dad.hpFp ? 'yy' : 'dad');
}

let tickCount = 0;
function tick(){
  tickCount++;
  if (scriptMode) applyScript(tickCount);
  if (MATCH.phase === 'FIGHT'){
    if (MATCH.ticksLeft > 0) MATCH.ticksLeft--;
    const sA = snapChar(yy), sB = snapChar(dad);                    // ① 冻结双方旧状态快照
    const iA = readInput(yy), iB = readInput(dad);                  // ① 同时读取双方输入
    const dA = decide(yy, sA, sB, iA), dB = decide(dad, sB, sA, iB); // ② 意图只读快照
    const fx = resolvePair(sA, sB, dA, dB);                         // ③ 统一解析命中/优先级
    tickChar(yy, iA, dA); tickChar(dad, iB, dB);                    // ④ 同时提交(各自只写自己)
    applyFx(fx);                                                    // ④ 命中效果同一tick落地
    if (interaction && interaction.kind === 'GRAPPLE') pinGrapple(); // 肩组共用接触锚点钉位
    yy.iid = dad.iid = interaction ? interaction.id : null;         // 交互id与对象同tick原子挂/摘
    tickParts();
    resolveMatch();
  } else {
    MATCH.overT++;
    tickParts();
    if (MATCH.overT > 60 && Input.pStart) resetMatch();         // 结算后 1 秒才接受重开
  }
  Input.pA = 0; Input.pB = 0; Input.pStart = 0;                 // 边沿输入每tick消费
}

/* ---------- 游泳者渲染 (锚点定位; 左向=阶段2 left头像数据+身体逐像素翻转; BREATH两帧头像; DIVE/UW侧脸·垂直头) ---------- */
function drawSwimmers(){
  const T = ORIGINAL_TUNING;
  const byId = { yy, dd: dad };
  const order = interaction ? interaction.drawOrder : ['yy', 'dd'];   // 交互中防守方先画, 攻击方叠上层
  for (const id of order){
    const c = byId[id];
    const f = SPRITES.frames[frameIdFor(c)];                 // 玩法只认契约, 不认像素来源
    const uw = c.state === ST.DIVE || c.state === ST.UW ||
               c.state === ST.EMERGE || c.state === ST.DROWN ||
               c.state === ST.KICK || c.state === ST.HIT || isGrappleState(c.state);
    const colors = colorsFor(c, uw);
    const bob = (c.state === ST.SURF || c.state === ST.BREATH) &&
                Math.floor(c.t / T.floatBobTicks) % 2 ? T.floatBobPx : 0;
    drawFrame(f, (c.axFp >> 8) - f.anchorX, (c.ayFp >> 8) - f.anchorY + bob, colors, uw);
  }
  for (const p of parts){
    const px = p.xFp >> 8, py = p.yFp >> 8;
    if (p.type === 'bubble'){
      const small = p.t > T.bubbleFrameT;                      // 分帧点: 2x2 → 1x1
      ctx.fillStyle = PAL.white;
      ctx.fillRect(px, py, small ? 1 : 2, small ? 1 : 2);
      if (!small){ ctx.fillStyle = p.inAir ? PAL.uwOut : PAL.waterLo; ctx.fillRect(px, py, 1, 1); }
    } else {
      drawPart(SPLASH[p.t < (T.splashTicks >> 1) ? 0 : 1], px, py, { W: PAL.wave }, false);
    }
  }
}

/* ---------- HUD (y 168..223, 黑底白框, 8x8 字体节奏) ---------- */
function fmtTime(ticks){                              // 10800 tick = 3:00 @60Hz
  const s = Math.ceil(Math.max(0, ticks) / 60), m = (s / 60) | 0, ss = s % 60;
  return m + ':' + (ss < 10 ? '0' : '') + ss;
}
function barW(vFp, maxFp, w){ return Math.max(0, Math.min(w, (vFp * w / maxFp) | 0)); }

/* 结算横幅 (完整败北演出/结算画面属 B4) */
function drawResult(){
  if (MATCH.phase !== 'OVER') return;
  const msg = MATCH.winner === 'yy' ? 'YANGYANG WIN' : MATCH.winner === 'dad' ? 'DAD WIN' : 'DRAW';
  const hint = 'PRESS ENTER';
  const w = Math.max(textW(msg), textW(hint)) + 16, x = 128 - (w >> 1), y = 54;
  ctx.fillStyle = PAL.black; ctx.fillRect(x, y, w, 28);
  ctx.fillStyle = PAL.white;
  ctx.fillRect(x, y, w, 1); ctx.fillRect(x, y + 27, w, 1);
  ctx.fillRect(x, y, 1, 28); ctx.fillRect(x + w - 1, y, 1, 28);
  drawTextC(msg, 128, y + 5, PAL.white);
  if (MATCH.overT > 60 && ((MATCH.overT / 30) | 0) % 2 === 0)
    drawTextC(hint, 128, y + 17, PAL.white);
}

function drawHUD(){
  ctx.fillStyle = PAL.black; ctx.fillRect(0, HUD_Y, LW, LH - HUD_Y);
  /* 双线白框 x10..245 / y169..218 */
  ctx.fillStyle = PAL.white;
  ctx.fillRect(10, 169, 236, 1); ctx.fillRect(10, 171, 236, 1);
  ctx.fillRect(10, 216, 236, 1); ctx.fillRect(10, 218, 236, 1);
  ctx.fillRect(10, 169, 1, 50); ctx.fillRect(12, 169, 1, 50);
  ctx.fillRect(243, 169, 1, 50); ctx.fillRect(245, 169, 1, 50);
  /* Row1: 1P YANGYANG | TIME | CPU DAD */
  drawText('1P', 18, 175, PAL.white);
  drawText('YANGYANG', 40, 175, PAL.white);
  drawTextC('TIME', 124, 175, PAL.white);
  drawText('CPU', 146, 175, PAL.white);
  drawText('DAD', 178, 175, PAL.white);
  /* 倒计时 (3:00 → 0:00, 硬标准) */
  drawTextC(fmtTime(MATCH.ticksLeft), 124, 183, PAL.white);
  /* HP 行 (跟随角色 hp; 双方均从左向右减少) */
  drawText('HP', 25, 191, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(40, 191, barW(yy.hpFp, ORIGINAL_TUNING.hpMaxFp, 60), 7);
  drawText('HP', 150, 191, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(168, 191, barW(dad.hpFp, ORIGINAL_TUNING.hpMaxFp, 61), 7);
  /* Oxy 行 (跟随角色 air) */
  drawText('Oxy', 17, 208, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(40, 208, (yy.airFp * 63 / ORIGINAL_TUNING.airMaxFp) | 0, 7);
  drawText('Oxy', 141, 208, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(168, 208, (dad.airFp * 63 / ORIGINAL_TUNING.airMaxFp) | 0, 7);
}

/* ---------- 渲染 + 60Hz 固定步进循环 (累加器; 逻辑与渲染分离) ---------- */
function render(){
  ctx.fillStyle = PAL.black; ctx.fillRect(0, 0, LW, LH);
  drawBackground();
  drawPool();
  drawSwimmers();
  drawResult();
  drawHUD();
  dctx.drawImage(sc, 0, 0, LW, LH, 0, 0, LW, LH);
}

scriptMode = new URLSearchParams(location.search).get('script');
const STEP = 1000 / 60;
let acc = 0, lastTs = 0;
function frame(ts){
  if (!lastTs) lastTs = ts;
  acc += Math.min(ts - lastTs, 200);      // 防后台标签大跳步
  lastTs = ts;
  while (acc >= STEP){ tick(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

/* 精灵数据自检: 每个map每行等宽 */
function spriteWidthErrors(){
  const bad = [];
  const check = (name, m) => {
    const w = m[0].length;
    m.forEach((r, i) => { if (r.length !== w) bad.push(name + ' row' + i + ' ' + r.length + '!=' + w); });
  };
  for (const k in BODY) BODY[k].forEach((m, i) => check('BODY.' + k + '[' + i + ']', m));
  for (const who in AVATAR) for (const d in AVATAR[who]) check('AVATAR.' + who + '.' + d, AVATAR[who][d]);
  for (const who in AVATAR_BREATH) for (const d in AVATAR_BREATH[who])
    AVATAR_BREATH[who][d].forEach((m, i) => check('AVATAR_BREATH.' + who + '.' + d + '[' + i + ']', m));
  for (const who in HEAD_SIDE) for (const d in HEAD_SIDE[who]) check('HEAD_SIDE.' + who + '.' + d, HEAD_SIDE[who][d]);
  for (const who in HEAD_DOWN) for (const d in HEAD_DOWN[who]) check('HEAD_DOWN.' + who + '.' + d, HEAD_DOWN[who][d]);
  SPLASH.forEach((m, i) => check('SPLASH[' + i + ']', m));
  /* SPRITES 契约自检: 每帧行数=h、每行宽=w、锚点在帧内、实心非空、字符全部在调色键内 */
  const semantic = new Set(['.', 'O', 'W', 'S', 's', 'd', 'C', 'c', 'H', 'h', 'T', 'L']);
  for (const id in SPRITES.frames){
    const f = SPRITES.frames[id];
    if (f.rows.length !== f.h) bad.push(id + ' rows=' + f.rows.length + '!=h' + f.h);
    f.rows.forEach((r, i) => { if (r.length !== f.w) bad.push(id + ' row' + i + ' ' + r.length + '!=w' + f.w); });
    if (f.anchorX < 0 || f.anchorX > f.w || f.anchorY < 0 || f.anchorY > f.h) bad.push(id + ' 锚点出帧');
    if (!f.bbox) bad.push(id + ' 空帧');
    /* 占位帧用语义调色键(由 colorsFor 上色); 正式帧用调色板索引键(由 f.pal 上色) */
    const keys = f.pal ? new Set(['.'].concat(Object.keys(f.pal))) : semantic;
    let illegal = null;
    for (const r of f.rows){ for (const ch of r) if (!keys.has(ch)){ illegal = ch; break; } if (illegal) break; }
    if (illegal) bad.push(id + ' 非法调色键 ' + illegal);
    /* 判定盒: 必须是独立数据, hurtbox 每帧必备; KICK 起手帧无hitbox/有效帧必有 */
    if (!f.hurtbox || !f.hurtbox.length) bad.push(id + ' 缺hurtbox');
    if ((f.hurtbox || []).concat(f.hitbox || []).some(b => b && b.provisional !== undefined))
      bad.push(id + ' 判定盒仍带provisional标记');
    const act = id.split('.')[1], fidx = id.split('.')[3];
    if ((act === 'KICK' || act === 'GRAPPLE_PUNCH') && fidx === '1' && (!f.hitbox || !f.hitbox.length))
      bad.push(id + ' 有效相位缺hitbox');
    if ((act === 'KICK' || act === 'GRAPPLE_PUNCH') && fidx === '0' && f.hitbox)
      bad.push(id + ' 起手/收招相位不应有hitbox');
  }
  /* 每个动作 × 2角色 × 2朝向 必须齐全 */
  const acts = new Set();
  for (const id in SPRITES.frames) acts.add(id.split('.')[1] + '.' + id.split('.')[3]);
  for (const a of acts) for (const av of ['yy', 'dd']) for (const d of ['R', 'L']){
    const [act, idx] = a.split('.');
    if (!SPRITES.frames[av + '.' + act + '.' + d + '.' + idx]) bad.push('缺帧 ' + av + '.' + act + '.' + d + '.' + idx);
  }
  return bad;
}

window.addEventListener('resize', fitCanvas);   // 窗口变化时重取整数倍
const qs = new URLSearchParams(location.search);
const preRun = parseInt(qs.get('to') || '0', 10);

if (qs.has('selftest')){
  /* R6自检: 无输入300tick / 贴边全状态循环(脚底连续+实际像素不裁图) / 池底姿态切换坐标不变+纯↑U纯↓D /
     demo轨迹全断言(实际非透明像素世界bbox: DIVE→UW与UW→EMERGE逐帧连续≤10px) /
     DIVE三过程帧 / UW三态(H/U/D) / BREATH四段单调+完成air=airMax / 独立Oxy(air=0→B→44tick→满) / 10万tick确定性压力 */
  const T = ORIGINAL_TUNING;
  const errs = spriteWidthErrors();
  /* 实际非透明像素世界bbox(与drawSwimmers同一定位: 身体左向逐像素翻转, 头像用left烘焙数据, 不再只看LAY逻辑框) */
  function worldBBox(c){                       // 直接读 SPRITES 契约的实心外接框(与渲染同一份数据)
    const f = SPRITES.frames[frameIdFor(c)];
    const ox = (c.axFp >> 8) - f.anchorX, oy = (c.ayFp >> 8) - f.anchorY, b = f.bbox;
    return b ? [ox + b.x, oy + b.y, ox + b.x + b.w - 1, oy + b.y + b.h - 1] : [ox, oy, ox, oy];
  }
  const snapOf = () => [yy.axFp, yy.ayFp, yy.state, yy.airFp, dad.axFp, dad.ayFp, dad.state, dad.airFp].join(',');
  /* A. 无输入300tick: 锚点/状态/Oxy完全不变, 无粒子 */
  const s0 = snapOf();
  for (let i = 0; i < 300; i++) tick();
  if (snapOf() !== s0) errs.push('idle300 drift: ' + s0 + ' -> ' + snapOf());
  if (parts.length) errs.push('idle300 parts=' + parts.length);
  /* B. 贴边回归: ax=20/236, 无横向输入驱动全状态循环; ax零漂移+脚底连续+全整数+不裁图 */
  for (const x0 of [ANCHOR_X_MIN_Fp >> 8, ANCHOR_X_MAX_Fp >> 8]){   // 钳制带边界随资产走
    const c = mkChar(FP(x0), 1, 'yy', '#3C9CF0');
    const inp = { L:0,R:0,U:0,D:0,A:0,B:0,pA:0,pB:0 };
    let clip = null; const seen = [];
    let prevAy = c.ayFp, prevSt = c.state;
    for (let i = 0; i < 220; i++){
      if (i === 0) inp.D = 1;                                    // 按住下潜→UW
      if (i === 30) inp.D = 0;
      if (i === 40) inp.U = 1;                                   // 上浮→EMERGE→SURF
      if (i === 70) inp.U = 0;
      if (i === 90){ inp.pA = 1; inp.A = 1; }                    // 垂直跳(prefDir=0)
      if (i === 91){ inp.pA = 0; inp.A = 0; }
      if (i === 160){ inp.pB = 1; inp.B = 1; }                   // B换气
      if (i === 161){ inp.pB = 0; inp.B = 0; }
      tickChar(c, inp);
      seen.push(c.state);
      if (!Number.isInteger(c.axFp) || !Number.isInteger(c.ayFp)) errs.push(`edge${x0} 非整数@tick${i}`);
      if (c.axFp !== FP(x0)) errs.push(`edge${x0} 横向瞬移@tick${i}: ${c.axFp / 256}`);
      if (c.state !== prevSt && Math.abs(c.ayFp - prevAy) > FP(3))   // 脚底连续(JUMP末帧抛物线残差2.19px→阈值3)
        errs.push(`edge${x0} 脚底跳变 ${prevSt}→${c.state}@tick${i}: ${prevAy / 256}→${c.ayFp / 256}`);
      const bb = worldBBox(c);                                // 实际非透明像素bbox裁图检查(非LAY逻辑框)
      if (bb[0] < 0 || bb[2] >= 256 || bb[1] < 0 || bb[3] >= 168) clip = c.state + '@' + i + ' [' + bb + ']';
      prevAy = c.ayFp; prevSt = c.state;
    }
    if (clip) errs.push(`edge${x0} 裁图 ` + clip);
    for (const st of ['DIVE','UW','EMERGE','SURF','JUMP','BREATH']) if (!seen.includes(st)) errs.push(`edge${x0} 缺状态 ` + st);
  }
  parts.length = 0;
  /* B2. 独立Oxy: air=0 → pB → 完整breathLockTicks → SURF且air=airMax; ay四段单调; 结束脚底108 */
  {
    const c = mkChar(FP(120), 1, 'yy', '#3C9CF0');
    c.airFp = 0;
    const inp = { L:0,R:0,U:0,D:0,A:0,B:0,pA:0,pB:1 };
    tickChar(c, inp);                                            // SURF→BREATH (t=0)
    inp.pB = 0; inp.B = 0;
    if (c.state !== ST.BREATH) errs.push('独立Oxy: pB未进BREATH');
    const aySeq = [c.ayFp]; let airMidBad = false;
    for (let i = 0; i < T.breathLockTicks; i++){
      tickChar(c, inp); aySeq.push(c.ayFp);
      if (i < T.breathLockTicks - 1 && c.airFp !== 0) airMidBad = true;   // 完成前不回氧
    }
    if (airMidBad) errs.push('独立Oxy: BREATH过程中air提前恢复');
    if (c.state !== ST.SURF) errs.push('独立Oxy: 44tick后未回SURF 实际' + c.state);
    if (c.airFp !== T.airMaxFp) errs.push('独立Oxy: 结束air=' + (c.airFp / 256) + ' 应满' + (T.airMaxFp / 256));
    if (aySeq[T.breathLockTicks] !== FOOT_SURF_Fp) errs.push('独立Oxy: 结束脚底=' + (aySeq[T.breathLockTicks] / 256) + ' 应108');
    for (let k = 0; k <= T.breathPrepTicks; k++)
      if (aySeq[k] !== FOOT_SURF_Fp) errs.push(`独立Oxy: 准备段t${k} ay=${aySeq[k] / 256} 应108`);
    for (let k = T.breathPrepTicks + 1; k <= T.breathPrepTicks + T.breathRiseTicks; k++)
      if (!(aySeq[k] < aySeq[k - 1])) errs.push(`独立Oxy: 上升段t${k} 未严格单调升起`);
    for (let k = T.breathPrepTicks + T.breathRiseTicks + 1; k <= T.breathPrepTicks + T.breathRiseTicks + T.breathHoldTicks; k++)
      if (aySeq[k] !== FOOT_SURF_Fp - T.breathRiseFp) errs.push(`独立Oxy: 顶峰段t${k} ay=${aySeq[k] / 256} 应96`);
    for (let k = T.breathPrepTicks + T.breathRiseTicks + T.breathHoldTicks + 1; k <= T.breathLockTicks; k++)
      if (aySeq[k] < aySeq[k - 1]) errs.push(`独立Oxy: 回落段t${k} 非单调回落`);
  }
  parts.length = 0;
  /* B3. 池底姿态切换: 横卧ay=166松方向→D, ax/ay完全不变(R6回归: 统一域后无钳制跳变); 纯↓=D/纯↑=U/横游=H */
  {
    const c = mkChar(FP(120), 1, 'yy', '#3C9CF0');
    c.state = ST.UW; c.t = 0; c.ayFp = T.uwBotFp;
    const inp = { L:0,R:1,U:0,D:0,A:0,B:0,pA:0,pB:0 };
    tickChar(c, inp);                                             // 横卧H(右移)
    if (c.uwPose !== 'H') errs.push('池底横游姿态=' + c.uwPose + ' (应H)');
    inp.R = 0;
    const axH = c.axFp, ayH = c.ayFp;
    tickChar(c, inp);                                             // 无输入→D
    if (c.uwPose !== 'D') errs.push('池底松方向姿态=' + c.uwPose + ' (应D)');
    if (c.axFp !== axH || c.ayFp !== ayH)
      errs.push(`池底H→D坐标漂移: ${axH / 256},${ayH / 256} → ${c.axFp / 256},${c.ayFp / 256}`);
    inp.D = 1; tickChar(c, inp);                                  // 纯↓
    if (c.uwPose !== 'D') errs.push('纯↓姿态=' + c.uwPose + ' (应D)');
    inp.D = 0; inp.U = 1; tickChar(c, inp);                       // 纯↑
    if (c.uwPose !== 'U') errs.push('纯↑姿态=' + c.uwPose + ' (应U)');
    inp.U = 0; inp.R = 1; tickChar(c, inp);                       // 回横卧
    if (c.uwPose !== 'H') errs.push('回横游姿态=' + c.uwPose + ' (应H)');
  }
  parts.length = 0;
  /* C. demo轨迹: 900tick逐tick记录(tickCount归零, 使tr索引与脚本时刻对齐: 脚本时刻t影响tr[t-1]) */
  scriptMode = 'demo';
  tickCount = 0;
  const tr = [];
  const jumps = [];
  const transitions = [];
  let jumpRec = null, emergeTick = -1, boostBeforeEmerge = -1;
  const breathBodySet = new Set(), breathHeadSet = new Set(), diveFrameSet = new Set();
  for (let i = 0; i < 900; i++){
    const pre = yy.state, preAx = yy.axFp, preAy = yy.ayFp, preBb = worldBBox(yy);
    tick();
    const postBb = worldBBox(yy);
    const hadLR = !!(Input.L || Input.R);                        // 本tick是否有横向输入(tick内不清L/R)
    if (pre !== yy.state){
      transitions.push([i, pre, yy.state, preAx, yy.axFp, preAy, yy.ayFp, hadLR]);
      if ((pre === ST.DIVE && yy.state === ST.UW) || (pre === ST.UW && yy.state === ST.EMERGE))   // R6: 实际像素bbox逐帧连续
        for (let e = 0; e < 4; e++)
          if (Math.abs(postBb[e] - preBb[e]) > 10)
            errs.push(`bbox跳变@tick${i} ${pre}→${yy.state}: [${preBb}]→[${postBb}]`);
      if (yy.state === ST.JUMP) jumpRec = { dir: yy.jumpDir, x0: yy.axFp };
      if (pre === ST.JUMP && jumpRec) jumps.push([jumpRec.dir, (yy.axFp - jumpRec.x0) / 256]);
      if (yy.state === ST.EMERGE){ emergeTick = i; boostBeforeEmerge = tr.length ? tr[tr.length - 1].boost : -1; }
    }
    if (yy.state === ST.DIVE) diveFrameSet.add(diveIdx(yy.t));
    if (yy.state === ST.BREATH){
      const bi = breathBodyIdx(yy.t), hi = breathHeadIdx(yy.t);
      if (bi >= 0) breathBodySet.add(bi);
      if (hi >= 0) breathHeadSet.add(hi);
    }
    tr.push({ t: i, st: yy.state, ax: yy.axFp, ay: yy.ayFp, boost: yy.boostFp, air: yy.airFp, pose: yy.uwPose });
    /* 全整数断言 */
    const vs = [yy.axFp, yy.ayFp, yy.boostFp, yy.airFp, dad.axFp, dad.ayFp, dad.boostFp, dad.airFp];
    for (const p of parts) vs.push(p.xFp, p.yFp);
    for (const v of vs) if (!Number.isInteger(v)){ errs.push('non-integer@tick' + i); break; }
    /* 不裁图断言(双人, 实际非透明像素世界bbox) */
    for (const c of [yy, dad]){
      const bb = worldBBox(c);
      if (bb[0] < 0 || bb[2] >= 256 || bb[1] < 0 || bb[3] >= 168){ errs.push(`clip ${c.avatar} ${c.state}@tick${i} [${bb}]`); break; }
    }
    if (errs.length > 12) break;
  }
  /* 状态切换断言: 无横向输入且旧态≠JUMP时ax不变; 脚底纵向跳变≤3px; 落点/入水点精确 */
  for (const [i, pre, cur, ax0, ax1, ay0, ay1, hadLR] of transitions){
    if (pre !== ST.JUMP && !hadLR && ax0 !== ax1)
      errs.push(`切换横移@tick${i} ${pre}→${cur}: ${ax0 / 256}→${ax1 / 256}`);
    if (Math.abs(ay1 - ay0) > FP(3))
      errs.push(`脚底跳变@tick${i} ${pre}→${cur}: ${ay0 / 256}→${ay1 / 256}`);
    if ((pre === ST.JUMP || pre === ST.EMERGE || pre === ST.BREATH) && cur === ST.SURF && ay1 !== FOOT_SURF_Fp)
      errs.push(`${pre}→SURF 脚底=${ay1 / 256} (应108)`);
    if (pre === ST.DIVE && cur === ST.UW && ay1 !== T.uwTopFp)
      errs.push(`DIVE→UW 脚底=${ay1 / 256} (应120)`);
  }
  /* 轨迹早退保护: 上面的循环在 errs>12 时会 break, 此时 tr 不足长。
     旧代码直接 tr[t].st 会抛异常 → 自检既不 PASS 也不 FAIL, 只留一个空白标题(排查代价极高)。
     改为返回哨兵, 让自检把真正的首个错误报出来。 */
  const at = t => tr[t] || { st:'<轨迹早退>', ax:0, ay:0, boost:0, air:0, pose:'-' };
  if (tr.length < 800) errs.push('轨迹早退: 只跑到 tick' + tr.length + ' (上游断言已失败, 见前面的错误)');
  /* 跳跃: 首跳垂直dx=0; 预选右+≥15px; 预选左-≤-15px */
  if (jumps.length !== 3) errs.push('jumps=' + jumps.length + ' (应3: 垂直/右/左)');
  if (jumps[0] && (jumps[0][0] !== 0 || jumps[0][1] !== 0)) errs.push('垂直跳 dir=' + jumps[0][0] + ' dx=' + jumps[0][1]);
  if (jumps[1] && (jumps[1][0] !== 1 || jumps[1][1] < 15)) errs.push('右跳 dir=' + jumps[1][0] + ' dx=' + jumps[1][1]);
  if (jumps[2] && (jumps[2][0] !== -1 || jumps[2][1] > -15)) errs.push('左跳 dir=' + jumps[2][0] + ' dx=' + jumps[2][1]);
  /* 点按下潜弹回: 300..350不进UW, 345回SURF */
  if (tr.slice(300, 351).some(r => r.st === ST.UW || r.st === ST.EMERGE)) errs.push('点按下潜未弹回');
  if (at(345).st !== ST.SURF) errs.push('tick345应SURF 实际' + at(345).st);
  /* 按住下潜: diveTicks=10实测 → 360按下, tr[369]进UW; DIVE三过程帧{0,1,2}都出现 */
  const uwTick = tr.findIndex(r => r.st === ST.UW);
  if (uwTick !== 369) errs.push('按住下潜进UW@' + uwTick + ' (应369=360+diveTicks10-1)');
  if (!(diveFrameSet.has(0) && diveFrameSet.has(1) && diveFrameSet.has(2)))
    errs.push('DIVE帧集合=' + [...diveFrameSet].join(',') + ' (应0,1,2)');
  /* UW三态: 右游=H横卧; 静止A段与纯下移段=D头朝下; demo中出现纯↑=U头朝上 */
  if (at(415).pose !== 'H') errs.push('UW右游应横卧(H) 实际' + at(415).pose);
  if (at(462).pose !== 'D') errs.push('UW静止应头朝下(D) 实际' + at(462).pose);
  if (at(475).pose !== 'D') errs.push('UW纯下移应头朝下(D) 实际' + at(475).pose);
  if (!tr.some(r => r.st === ST.UW && r.pose === 'U')) errs.push('demo未出现UW纯↑头朝上(U)姿态');
  /* 静止A不加boost; 移动A加boost(脚本时刻t影响tr[t-1]) */
  if (!(at(462).boost <= at(459).boost)) errs.push('静止A后boost增加 ' + at(459).boost + '->' + at(462).boost);
  if (!(at(419).boost > at(418).boost)) errs.push('移动A未加boost@420 ' + at(418).boost + '->' + at(419).boost);
  if (!(at(429).boost > at(428).boost)) errs.push('移动A未加boost@430 ' + at(428).boost + '->' + at(429).boost);
  /* 八向: 470..545 ay范围≥4px, ax范围≥3px, 斜向tick≥12 */
  const seg = tr.slice(470, 546);
  const axs = seg.map(r => r.ax), ays = seg.map(r => r.ay);
  if (Math.max(...ays) - Math.min(...ays) < FP(4)) errs.push('八向ay范围不足');
  if (Math.max(...axs) - Math.min(...axs) < FP(3)) errs.push('八向ax范围不足');
  let diagTicks = 0;
  for (let i = 471; i <= 545; i++) if (tr[i].ax !== tr[i-1].ax && tr[i].ay !== tr[i-1].ay) diagTicks++;
  if (diagTicks < 12) errs.push('斜向tick=' + diagTicks + ' (应≥12)');
  /* EMERGE: boost清零(前一tick>0→0); ≤600回SURF */
  if (emergeTick < 0) errs.push('未EMERGE');
  else {
    if (!(boostBeforeEmerge > 0)) errs.push('EMERGE前boost应>0 实际' + boostBeforeEmerge);
    if (at(emergeTick).boost !== 0) errs.push('EMERGE后boost未清零');
  }
  if (!tr.slice(560, 601).some(r => r.st === ST.SURF)) errs.push('600前未回SURF');
  /* BREATH: 638耗空Oxy→640进入, 44tick锁定→tr[639..682], tr[683]退出; 身体三帧/头像两帧; 过程不回氧; 完成air=airMax */
  if (!(at(637).air < FP(2))) errs.push('耗空Oxy失败 air=' + (at(637).air / 256));
  if (!tr.slice(645, 683).every(r => r.st === ST.BREATH)) errs.push('BREATH未锁定到682');
  if (at(683).st !== ST.SURF) errs.push('tick683应退出BREATH 实际' + at(683).st);
  if (at(682).air !== at(639).air) errs.push('BREATH过程不应回氧 ' + at(639).air + '->' + at(682).air);
  if (at(683).air !== T.airMaxFp) errs.push('BREATH完成未回满 air=' + (at(683).air / 256));
  if (breathBodySet.size !== 3) errs.push('BREATH身体帧集合=' + [...breathBodySet].join(','));
  if (breathHeadSet.size !== 2) errs.push('BREATH头像帧集合=' + [...breathHeadSet].join(','));
  /* BREATH头像静态断言: 每人每向每帧与normal差异>0, 两帧互异 */
  for (const who of ['yy','dd']) for (const d of ['left','right']){
    const base = AVATAR[who][d].join('');
    for (const f of [0,1]){
      if (AVATAR_BREATH[who][d][f].join('') === base) errs.push(`breath ${who}.${d}.f${f} 与normal相同`);
    }
    if (AVATAR_BREATH[who][d][0].join('') === AVATAR_BREATH[who][d][1].join('')) errs.push(`breath ${who}.${d} 两帧相同`);
  }
  /* 侧脸/垂直头静态断言: 左右非精确镜像(人工修正光源); 与正脸不同 */
  for (const HS of [HEAD_SIDE, HEAD_DOWN]) for (const who of ['yy','dd']){
    const mir = HS[who].right.map(r => [...r].reverse().join(''));
    if (mir.join('') === HS[who].left.join('')) errs.push(`侧脸/垂直头 ${who} 左右精确镜像`);
    if (HS[who].right.join('') === AVATAR[who].right.join('')) errs.push(`侧脸/垂直头 ${who} 与正脸相同`);
  }
  /* Oxy: 水下耗氧(400<376); 水面自然恢复(630>601) */
  if (!(at(400).air < at(376).air)) errs.push('水下未耗氧');
  if (!(at(630).air > at(601).air)) errs.push('水面未自然回氧');
  /* D. B2踢击: 水下pB→KICK三相位; ACTIVE相位命中→对方扣HP+进HIT+击退;
       命中事件去重(HP只扣一次); interaction建立/结束原子(角色iid同步挂摘) */
  {
    resetMatch(); scriptMode = null;
    yy.state = ST.UW; yy.t = 0; yy.uwPose = 'H'; yy.axFp = FP(120); yy.ayFp = FP(140); yy.dir = 1;
    dad.state = ST.UW; dad.t = 0; dad.uwPose = 'H'; dad.axFp = FP(140); dad.ayFp = FP(140); dad.dir = -1;
    const hpD0 = dad.hpFp, dadX0 = dad.axFp;
    Input.pB = 1; Input.B = 1; tick(); Input.pB = 0; Input.B = 0;
    if (yy.state !== ST.KICK) errs.push('踢击: 水下pB未进KICK 实际' + yy.state);
    if (!interaction || interaction.kind !== 'KICK') errs.push('踢击: interaction未建立');
    if (interaction && (yy.iid !== interaction.id || dad.iid !== interaction.id))
      errs.push('踢击: 双方iid未原子挂到interaction');
    const iid0 = interaction ? interaction.id : -1;
    let hitTick = -1;
    for (let i = 0; i < 60 && hitTick < 0; i++){ tick(); if (dad.state === ST.HIT) hitTick = i; }
    if (hitTick < 0) errs.push('踢击: 对方未进HIT');
    if (dad.hpFp !== hpD0 - T.kickDamageFp)
      errs.push('踢击: 命中应恰好扣一次HP ' + (hpD0 / 256) + '->' + (dad.hpFp / 256));
    if (hitTick >= 0 && interaction && !interaction.appliedEvents['hit:yy'])
      errs.push('踢击: 命中事件未记入appliedEvents');
    for (let i = 0; i < 60 && (yy.state === ST.KICK || dad.state === ST.HIT); i++) tick();
    tick(); tick();                                    // resolvePair 在下一tick的快照上才看到双方都不踢
    if (interaction) errs.push('踢击: 踢击结束后interaction未清空');
    if (yy.iid !== null || dad.iid !== null) errs.push('踢击: 结束后双方iid未原子摘除');
    if (!(dad.axFp > dadX0)) errs.push('踢击: 受击方未被击退');
    /* 双方同tick起手: 快照结算下应互相命中双双扣血(旧顺序结算会让后tick者白挨打) */
    resetMatch();
    yy.state = ST.UW; yy.t = 0; yy.uwPose = 'H'; yy.axFp = FP(120); yy.ayFp = FP(140); yy.dir = 1;
    dad.state = ST.UW; dad.t = 0; dad.uwPose = 'H'; dad.axFp = FP(140); dad.ayFp = FP(140); dad.dir = -1;
    dad.input = '1P';
    Input.pB = 1; Input.B = 1; tick(); Input.pB = 0; Input.B = 0;
    if (yy.state !== ST.KICK || dad.state !== ST.KICK)
      errs.push('踢击: 同时起手失败 yy=' + yy.state + ' dad=' + dad.state);
    for (let i = 0; i < 30; i++) tick();
    if (!(yy.hpFp < T.hpMaxFp && dad.hpFp < T.hpMaxFp))
      errs.push('踢击: 同时起手未双向命中(存在先手偏差) yy=' + (yy.hpFp / 256) + ' dad=' + (dad.hpFp / 256));
    dad.input = 'IDLE';
    resetMatch();
  }
  parts.length = 0;
  /* E2. 确定性双跑: 同一初始状态+同一输入流(demo脚本), 逐tick状态hash完全一致 */
  {
    const runs = [];
    for (let run = 0; run < 2; run++){
      resetMatch(); scriptMode = 'demo'; tickCount = 0;
      const hs = [];
      for (let i = 0; i < 900; i++){ tick(); hs.push(hashState()); }
      runs.push(hs);
    }
    scriptMode = null;
    let diffAt = -1;
    for (let i = 0; i < 900; i++) if (runs[0][i] !== runs[1][i]){ diffAt = i; break; }
    if (diffAt >= 0) errs.push('确定性双跑分叉@tick' + diffAt);
    resetMatch();
  }
  parts.length = 0;
  /* E3. 肩组确定性+流程: 同一脚本(靠近→纠缠→两拳→松开)跑两遍, 逐tick hash一致;
         顺带断言: 双方同时进入 / 出拳扣血恰好两拳 / 松开后有限tick内解开 / 全程一个interaction */
  {
    const run = () => {
      resetMatch(); scriptMode = null; tickCount = 0;
      yy.state = ST.UW; yy.t = 0; yy.uwPose = 'H'; yy.dir = 1; yy.axFp = FP(110); yy.ayFp = FP(140);
      dad.state = ST.UW; dad.t = 0; dad.uwPose = 'H'; dad.dir = -1; dad.axFp = FP(130); dad.ayFp = FP(140);
      const hs = []; const iids = new Set();
      let enterTick = -1, freeTick = -1; const hpD0 = dad.hpFp;
      for (let i = 0; i < 400; i++){
        Input.R = i < 20 ? 1 : 0;
        Input.B = Input.pB = (i === 40 || i === 70) ? 1 : 0;
        tick(); hs.push(hashState());
        if (interaction){ iids.add(interaction.id); }
        if (enterTick < 0 && isGrappleState(yy.state) && isGrappleState(dad.state)) enterTick = i;
        if (enterTick >= 0 && freeTick < 0 && !isGrappleState(yy.state) && !isGrappleState(dad.state)) freeTick = i;
      }
      Input.R = 0; Input.B = 0; Input.pB = 0;
      return { hs, iids, enterTick, freeTick, dmg: hpD0 - dad.hpFp };
    };
    const r1 = run(), r2 = run();
    let gDiff = -1;
    for (let i = 0; i < 400; i++) if (r1.hs[i] !== r2.hs[i]){ gDiff = i; break; }
    if (gDiff >= 0) errs.push('肩组双跑分叉@tick' + gDiff);
    if (r1.enterTick < 0) errs.push('肩组: 未进入');
    if (r1.freeTick < 0) errs.push('肩组: 松开输入后未解开(永久锁死)');
    if (r1.dmg !== 2 * T.punchDamageFp)
      errs.push('肩组: 两拳扣血应为' + (2 * T.punchDamageFp / 256) + ' 实际' + (r1.dmg / 256));
    if (r1.iids.size !== 1) errs.push('肩组: 交互对象数=' + r1.iids.size + ' (应1)');
    resetMatch();
  }
  parts.length = 0;
  /* E. 10万tick确定性压力: LCG伪随机输入(imul精确低32位, 禁Math.random), 全程整数/锚点域内/实际像素不裁图 */
  let stressOk = true;
  {
    let seed = 0x12345678;
    const rnd = () => { seed = (Math.imul(seed, 1103515245) + 12345) | 0; return (seed >>> 0) / 4294967296; };
    const c = mkChar(FP(128), 1, 'yy', '#3C9CF0');
    const inp = { L:0,R:0,U:0,D:0,A:0,B:0,pA:0,pB:0 };
    for (let i = 0; i < 100000; i++){
      const r = rnd();
      inp.L = r < 0.2 ? 1 : 0; inp.R = r >= 0.2 && r < 0.4 ? 1 : 0;
      inp.U = r >= 0.4 && r < 0.55 ? 1 : 0; inp.D = r >= 0.55 && r < 0.7 ? 1 : 0;
      inp.pA = rnd() < 0.05 ? 1 : 0; inp.pB = rnd() < 0.02 ? 1 : 0;
      tickChar(c, inp);
      if (!Number.isInteger(c.axFp) || !Number.isInteger(c.ayFp) || !Number.isInteger(c.airFp) || !Number.isInteger(c.boostFp)){
        errs.push('stress非整数@' + i); stressOk = false; break;
      }
      if (c.axFp < ANCHOR_X_MIN_Fp || c.axFp > ANCHOR_X_MAX_Fp || c.ayFp < 0 || c.ayFp > FP(168)){
        errs.push('stress锚点出域@' + i + ' ay=' + (c.ayFp / 256)); stressOk = false; break;
      }
      const bb = worldBBox(c);
      if (bb[0] < 0 || bb[2] >= 256 || bb[1] < 0 || bb[3] >= 168){
        errs.push('stress裁图@' + i + ' ' + c.state + '/' + c.uwPose + ' [' + bb + ']'); stressOk = false; break;
      }
    }
    parts.length = 0;
  }
  document.title = (errs.length ? 'FAIL ' : 'PASS ') +
    JSON.stringify({ jumps, errs: errs.slice(0, 8), emergeTick, uwTick, transitions: transitions.length, stress100k: stressOk, parts: parts.length });
  fitCanvas(); render();
} else if (qs.has('sheet')){
  /* GIF帧矩阵: 5列x24行=120格, 每格先跑7 tick(共840), 渲染后拷入大canvas */
  scriptMode = 'demo';
  const COLS = 5, ROWS = 24;
  const big = document.createElement('canvas');
  big.width = COLS * LW; big.height = ROWS * LH;
  const bctx = big.getContext('2d');
  bctx.imageSmoothingEnabled = false;
  for (let i = 0; i < COLS * ROWS; i++){
    for (let j = 0; j < 7; j++) tick();
    render();
    bctx.drawImage(sc, (i % COLS) * LW, ((i / COLS) | 0) * LH);
  }
  document.body.innerHTML = '';
  document.body.appendChild(big);
  document.title = 'SHEET ticks=' + tickCount;
} else if (preRun > 0){
  /* 验收截图模式: ?script=demo&to=N 同步预跑N tick后静态渲染(不启动rAF) */
  for (let i = 0; i < preRun; i++) tick();
  fitCanvas(); render();
  if (qs.has('debug'))
    document.title = JSON.stringify({ tick: tickCount,
      yy: { x: yy.axFp / 256, y: yy.ayFp / 256, st: yy.state, dir: yy.dir, pref: yy.prefDir,
            boost: yy.boostFp / 256, air: Math.round(yy.airFp / 256) },
      dad: { x: dad.axFp / 256, y: dad.ayFp / 256, st: dad.state }, parts: parts.length });
} else {
  fitCanvas();
  requestAnimationFrame(frame);
}
</script>
</body>
