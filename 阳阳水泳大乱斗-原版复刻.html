function drawText(str, x, y, col){
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = col;
  let cx = x;
  for(const ch of str){
    const g = F5[ch] || F5[ch.toUpperCase()] || F5[' '];
    for(let r = 0; r < 7; r++) for(let c = 0; c < 5; c++)
      if(g[r][c] === '1') ctx.fillRect(cx + c, y + r, 1, 1);
    cx += 6;
  }
}
function textW(str){ return str.length * 6; }
function drawTextC(str, x, y, col){ drawText(str, Math.round(x - textW(str)/2), y, col); }

/* ---------- 远景: 日版固定像素背景 (RLE 数据来自 jp-action-e 量化) ---------- */
function drawBackground(){
  for(let y = 0; y < BG_RLE.length; y++){
    let x = 0;
    for(const [ci, len] of BG_RLE[y]){
      ctx.fillStyle = BG_COLORS[ci];
      ctx.fillRect(x, y, len, 1);
      x += len;
    }
  }
}

    let x = 0;
    for(const [ci, len] of POOL_RLE[y]){
      ctx.fillStyle = POOL_COLORS[ci];
      ctx.fillRect(x, 72 + y, len, 1);
      x += len;
    }
  }

  ctx.fillStyle = PAL.black; ctx.fillRect(0, DIV_Y, LW, 2);

  const bx = 148, by = 144;
  ctx.fillStyle = PAL.uwSkin;
  ctx.fillRect(bx - 9, by + 3, 9, 2);                          // 前伸手臂
  ctx.fillRect(bx - 12, by + 2, 3, 3);                         // 手
  ctx.fillRect(bx, by, 10, 8);                                 // 头
  ctx.fillStyle = PAL.uwBody;
  ctx.fillRect(bx, by, 10, 3);                                 // 泳帽
  ctx.fillStyle = PAL.white; ctx.fillRect(bx + 1, by + 4, 2, 2);
  ctx.fillStyle = PAL.uwOut; ctx.fillRect(bx + 1, by + 5, 1, 1);
  ctx.fillStyle = PAL.uwBody;
  ctx.fillRect(bx + 10, by + 1, 13, 7);                        // 躯干
  ctx.fillStyle = PAL.uwOut;
  ctx.fillRect(bx + 23, by + 1, 4, 7);                         // 泳裤
  ctx.fillStyle = PAL.uwSkin;                                  // 双腿(剪式)
  ctx.fillRect(bx + 27, by - 1, 10, 3); ctx.fillRect(bx + 37, by - 2, 3, 2);
  ctx.fillRect(bx + 27, by + 6, 10, 3); ctx.fillRect(bx + 37, by + 8, 3, 2);
  ctx.fillStyle = PAL.uwOut;                                   // 底部描边
  ctx.fillRect(bx, by + 8, 10, 1); ctx.fillRect(bx + 10, by + 8, 13, 1);
  ctx.fillStyle = PAL.white;                                   // 静态气泡(固定坐标)
  ctx.fillRect(bx - 7, by - 5, 2, 2); ctx.fillRect(bx - 12, by - 8, 1, 1);
  ctx.fillStyle = PAL.waterLo; ctx.fillRect(bx - 4, by - 10, 2, 2);
}

/* ---------- HUD (y 168..223, 黑底白框, 8x8 字体节奏) ---------- */
function drawHUD(){
  ctx.fillStyle = PAL.black; ctx.fillRect(0, HUD_Y, LW, LH - HUD_Y);
  /* 双线白框 x10..245 / y169..218 */
  ctx.fillStyle = PAL.white;
  ctx.fillRect(10, 169, 236, 1); ctx.fillRect(10, 171, 236, 1);
  ctx.fillRect(10, 216, 236, 1); ctx.fillRect(10, 218, 236, 1);
  ctx.fillRect(10, 169, 1, 50); ctx.fillRect(12, 169, 1, 50);
  ctx.fillRect(243, 169, 1, 50); ctx.fillRect(245, 169, 1, 50);
  /* Row1: 1P YANGYANG | TIME | CPU DAD */
  drawText('1P', 18, 175, PAL.white);
  drawText('YANGYANG', 40, 175, PAL.white);
  drawTextC('TIME', 124, 175, PAL.white);
  drawText('CPU', 146, 175, PAL.white);
  drawText('DAD', 178, 175, PAL.white);
  /* 倒计时 (初始 3:00) */
  drawTextC('3:00', 124, 183, PAL.white);
  /* HP 行 (满槽) */
  drawText('HP', 25, 191, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(40, 191, 60, 7);
  drawText('HP', 150, 191, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(168, 191, 61, 7);
  /* Oxy 行 (满槽) */
  drawText('Oxy', 17, 208, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(40, 208, 63, 7);
  drawText('Oxy', 141, 208, PAL.white);
  ctx.fillStyle = PAL.hudBar; ctx.fillRect(168, 208, 63, 7);
}

/* ---------- 渲染 (阶段1: 静态画面只渲染一次, 无 rAF 循环) ---------- */
function render(){
  ctx.fillStyle = PAL.black; ctx.fillRect(0, 0, LW, LH);
  drawBackground();
  drawPool();
  drawSwimmers();
  drawHUD();
  dctx.drawImage(sc, 0, 0, LW, LH, 0, 0, LW, LH);
}

window.addEventListener('resize', fitCanvas);   // 窗口变化时重取整数倍并重绘一次
fitCanvas();
</script>
</body>
